<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Text Control</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #211a2e;
      background: #f8f5ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, #d9c7ff 0, transparent 32%),
        radial-gradient(circle at 85% 85%, #eadcff 0, transparent 35%),
        linear-gradient(135deg, #fbf9ff, #eee8ff);
    }
    .card {
      width: min(680px, 100%);
      padding: 34px;
      border: 1px solid #ddd2f5;
      border-radius: 26px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 25px 80px rgba(71,42,125,.16);
      backdrop-filter: blur(16px);
    }
    .badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      background: #f0eaff;
      color: #6940bd;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); }
    .sub { margin: 0 0 28px; color: #746b82; line-height: 1.5; }
    label { display:block; margin: 14px 0 8px; font-size: 14px; font-weight: 700; }
    textarea, input {
      width: 100%;
      border: 1px solid #d8cfee;
      border-radius: 15px;
      background: #fff;
      outline: none;
      font: inherit;
    }
    textarea {
      min-height: 170px;
      padding: 16px;
      resize: vertical;
      font-size: 18px;
    }
    input { padding: 14px; }
    textarea:focus, input:focus {
      border-color: #805ad5;
      box-shadow: 0 0 0 4px #805ad522;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px 18px;
      border: 0;
      border-radius: 15px;
      background: #7048c8;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #5f38b2; }
    button:disabled { opacity: .65; cursor: wait; }
    .status {
      margin-top: 16px;
      min-height: 46px;
      padding: 13px 14px;
      border-radius: 13px;
      background: #f5f1fc;
      color: #5f526e;
      line-height: 1.35;
    }
    .counter { text-align:right; margin-top:6px; color:#887f96; font-size:12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">UNITY TEXT CONTROL</div>
    <h1>Change Unity Text</h1>
    <p class="sub">Enter a message below. Unity checks the server automatically and updates its TextMeshPro object when the message changes.</p>

    <label for="text">Text to display in Unity</label>
    <textarea id="text" maxlength="2000" placeholder="Type something..."></textarea>
    <div class="counter"><span id="count">0</span>/2000</div>

    <label for="key">Control key</label>
    <input id="key" type="password" autocomplete="off" placeholder="Enter your Vercel CONTROL_KEY">

    <button id="send">Update Unity Text</button>
    <div class="status" id="status">Ready.</div>
  </main>

  <script>
    const text = document.getElementById("text");
    const key = document.getElementById("key");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const count = document.getElementById("count");

    text.addEventListener("input", () => count.textContent = text.value.length);

    send.addEventListener("click", async () => {
      if (!key.value) {
        status.textContent = "Enter your control key first.";
        return;
      }

      send.disabled = true;
      status.textContent = "Updating Unity...";

      try {
        const response = await fetch("/api/set-text", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: text.value,
            key: key.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Update failed.");
        }

        status.textContent = "✓ Unity text updated successfully.";
      } catch (error) {
        status.textContent = "✕ " + error.message;
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
